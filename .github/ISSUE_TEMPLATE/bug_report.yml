name: 🐞 Bug Report
description: Report a bug or unexpected behaviour in nuxt-driver.js
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the form below so we can investigate quickly.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce the behaviour.
      placeholder: |
        1. Add the module to nuxt.config
        2. Call useDriver('tour') in a component
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened? Include any error messages or console output.
    validations:
      required: true

  - type: input
    id: module-version
    attributes:
      label: nuxt-driver.js Version
      placeholder: "e.g. 0.0.24"
    validations:
      required: true

  - type: input
    id: nuxt-version
    attributes:
      label: Nuxt Version
      placeholder: "e.g. 4.4.4"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g. macOS 15, Ubuntu 24.04, Windows 11"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or reproduction links.
    validations:
      required: false
